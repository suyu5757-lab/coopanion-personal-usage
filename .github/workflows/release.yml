name: release

# This personal release builds Apple silicon macOS installers only.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            files: dist/Coopanion-*-mac-arm64.dmg dist/Coopanion-*-mac-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false
      - run: corepack enable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:installer
        env:
          PACK_ARCH: ${{ matrix.arch }}
          COOPANION_CHANNEL: ${{ matrix.channel }}
          # no Developer ID: the macOS build is signed ad hoc (electron-builder.yml)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp ${{ matrix.files }} release-artifacts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installers-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.channel || 'github' }}
          path: release-artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cd release-artifacts
          files=("Coopanion-${version}-mac-arm64.dmg" "Coopanion-${version}-mac-arm64.zip")
          for file in "${files[@]}"; do test -s "$file"; done
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cd ..
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          test -f "$notes"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Coopanion $GITHUB_REF_NAME" --notes-file "$notes"
          # Local, verified installers may already be published before this workflow finishes.
          if test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != true; then
            echo "Release already published; keeping its existing assets."
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file "$notes"
